name: 04 - Using Actions
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v4
      - name: Setup Node
        run: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install Dependencies.
        run: npm ci
        
